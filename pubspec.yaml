name: miokoapp
description: "Unofficial native client for mioko.ai"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP клиент
  dio: ^5.8.0+1

  # Безопасное хранение токенов
  flutter_secure_storage: ^9.2.4

  # Локальное хранение настроек
  shared_preferences: ^2.3.5

  # JSON сериализация
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  material_ui: ^1.11.0
  dynamic_color: ^2.1.0

  # Выбор фото из галереи / камеры
  image_picker: ^1.1.2

  # SVG-иконки (лого, жемчужины)
  flutter_svg: ^2.4.0

  # Открытие ссылок во внешних приложениях
  url_launcher: ^6.3.3

  # Виджет оплаты CloudPayments внутри приложения
  webview_flutter: ^4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Генерация кода (Freezed + Riverpod)
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
